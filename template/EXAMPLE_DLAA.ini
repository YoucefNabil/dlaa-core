; Example DLAA mod settings. Copy next to the built d3d11.dll in the game folder.

[General]
; 0 = pure pass-through proxy (no hooks at all)
Enabled=1

[DLAA]
Enabled=1
; Virtual-key code (0x77 = F8)
ToggleKey=0x77
; Texture LOD bias while DLAA runs, -2..0 (0 = sampler hooks not installed)
MipBias=0

[Debug]
; Enables the debug keys below and the debug-only settings
Enabled=0
; Pass list of the next frame to EXAMPLE_DLAA_frame_*.txt (0x79 = F10)
DumpFrameKey=0x79
; >0 = dump automatically after this many frames
DumpFrameAt=0
; Every created shader's bytecode to EXAMPLE_DLAA_shaders\ (once each)
DumpShaders=0
; Log draw / dispatch / map counts every N frames (0 = off)
StatsEvery=0
